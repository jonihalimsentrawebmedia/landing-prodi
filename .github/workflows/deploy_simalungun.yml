name: Deploy web_publick_stain_prodi

on:
  push:
    branches:
      - master

env:
  APP_DIR: /home/syamil/apps/web_publick_stain_prodi
  PM2_NAME: usi-prodi
  PORT: '3105'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate required secrets
        env:
          RAW_VPS_HOST: ${{ secrets.SIMALUNGUN_VPS_HOST }}
          RAW_VPS_USER: ${{ secrets.SIMALUNGUN_VPS_USER }}
          RAW_NEXT_PUBLIC_API_URL: ${{ secrets.SIMALUNGUN_NEXT_PUBLIC_API_URL }}
          RAW_API_URL: ${{ secrets.SIMALUNGUN_API_URL }}
        run: |
          set -euo pipefail
          for name in RAW_VPS_HOST RAW_VPS_USER RAW_NEXT_PUBLIC_API_URL RAW_API_URL; do
            value="$(printf '%s' "${!name}" | xargs)"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Normalize deploy variables
        env:
          RAW_VPS_HOST: ${{ secrets.SIMALUNGUN_VPS_HOST }}
          RAW_VPS_USER: ${{ secrets.SIMALUNGUN_VPS_USER }}
          RAW_NEXT_PUBLIC_API_URL: ${{ secrets.SIMALUNGUN_NEXT_PUBLIC_API_URL }}
          RAW_API_URL: ${{ secrets.SIMALUNGUN_API_URL }}
        run: |
          set -euo pipefail
          echo "VPS_HOST=$(printf '%s' "$RAW_VPS_HOST" | xargs)" >> "$GITHUB_ENV"
          echo "VPS_USER=$(printf '%s' "$RAW_VPS_USER" | xargs)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_URL=$(printf '%s' "$RAW_NEXT_PUBLIC_API_URL" | xargs)" >> "$GITHUB_ENV"
          echo "API_URL=$(printf '%s' "$RAW_API_URL" | xargs)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone bundle
        run: |
          pnpm build
          rm -rf deploy
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          cp -R .next/static deploy/.next/static
          if [ -d public ]; then
            cp -R public deploy/public
          fi

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SIMALUNGUN_VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" 2>/dev/null >> ~/.ssh/known_hosts

      - name: Upload standalone bundle
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR/current'"
          rsync -avz --delete \
            deploy/ \
            "$VPS_USER@$VPS_HOST:$APP_DIR/current/"

      - name: Restart PM2
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' PM2_NAME='$PM2_NAME' PORT='$PORT' API_URL='$API_URL' NEXT_PUBLIC_API_URL='$NEXT_PUBLIC_API_URL' HOSTNAME='127.0.0.1' bash -s" << 'EOF'
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          [ -f "$HOME/.profile" ] && . "$HOME/.profile"
          [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:$PATH"

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "pm2 not found in PATH" >&2
            exit 1
          fi

          cd "$APP_DIR/current"

          if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_NAME" --update-env
          else
            pm2 start server.js --name "$PM2_NAME" --cwd "$APP_DIR/current" --interpreter node
          fi

          pm2 save
          EOF
