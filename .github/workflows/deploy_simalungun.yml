name: Deploy web_publick_stain_prodi to Simalungun VPS

on:
  push:
    branches:
      - master

env:
  APP_DIR: /home/syamil/apps/web_publick_stain_prodi
  PM2_NAME: usi-prodi
  PORT: 3105

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SIMALUNGUN_VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SIMALUNGUN_VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync source code
        run: |
          rsync -avz --delete \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.idea \
            --exclude=.next \
            --exclude=.env* \
            ./ \
            ${{ secrets.SIMALUNGUN_VPS_USER }}@${{ secrets.SIMALUNGUN_VPS_HOST }}:${{ env.APP_DIR }}

      - name: Build & Restart PM2
        run: |
          ssh ${{ secrets.SIMALUNGUN_VPS_USER }}@${{ secrets.SIMALUNGUN_VPS_HOST }} "APP_DIR='${APP_DIR}' PM2_NAME='${PM2_NAME}' PORT='${PORT}' bash -s" << 'EOF'
          set -euo pipefail
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          corepack enable >/dev/null 2>&1 || true
          corepack prepare pnpm@10.33.0 --activate >/dev/null 2>&1 || true

          mkdir -p "${APP_DIR}"
          cd "${APP_DIR}"

          cat > .env.production <<'ENVEOF'
          NEXT_PUBLIC_API_URL=${{ secrets.SIMALUNGUN_NEXT_PUBLIC_API_URL }}
          API_URL=${{ secrets.SIMALUNGUN_API_URL }}
          ENVEOF

          pnpm install --frozen-lockfile
          pnpm build

          if pm2 describe "${PM2_NAME}" >/dev/null 2>&1; then
            pm2 restart "${PM2_NAME}" --update-env
          else
            pm2 start pnpm --name "${PM2_NAME}" --cwd "${APP_DIR}" -- start -- --hostname 127.0.0.1 --port "${PORT}"
          fi

          pm2 save
          EOF
